name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Pinned to the version the app is built and tested with locally. Newer stable releases
        # (3.50+) deprecate package:flutter/material.dart, which fails analyze until the app
        # migrates; bump this deliberately, together with that migration.
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # design_test.dart holds the golden screenshots, drawn on the author's OS. Text rendering
      # differs on Linux, so CI runs every other test file and the goldens run locally.
      - run: flutter test $(ls test/*_test.dart | grep -v design_test)

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover
        working-directory: backend
