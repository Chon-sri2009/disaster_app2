name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # design_test.dart holds the golden screenshots, drawn on the author's OS. Text rendering
      # differs on Linux, so CI runs every other test file and the goldens run locally.
      - run: flutter test $(ls test/*_test.dart | grep -v design_test)

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest test_ingest
        working-directory: backend
